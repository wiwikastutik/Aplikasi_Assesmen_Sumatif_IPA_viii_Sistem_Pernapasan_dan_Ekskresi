        function App() {

            const [view, setView] = React.useState('login'); // 'login', 'exam', 'result', 'admin'

            const [questions, setQuestions] = React.useState(() => {
                const saved = localStorage.getItem('mts_questions');
                return saved ? JSON.parse(saved) : defaultQuestions;
            });

            const [studentAttempts, setStudentAttempts] = React.useState(() => {
                const saved = localStorage.getItem('mts_attempts');
                return saved ? JSON.parse(saved) : [];
            });

            // Student session info
            const [currentStudent, setCurrentStudent] = React.useState({
                nama: '',
                kelas: 'VIII A',
                presensi: ''
            });

            const [isTestingMode, setIsTestingMode] = React.useState(false); // If true, launched from admin

            // Active exam state
            const [answers, setAnswers] = React.useState({});
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [timeLeft, setTimeLeft] = React.useState(30 * 60); // 30 mins in sec
            const [timerActive, setTimerActive] = React.useState(false);
            const [examSubmitted, setExamSubmitted] = React.useState(false);
            const [finalResult, setFinalResult] = React.useState(null);

            // Save state to localStorage whenever questions or attempts change
            React.useEffect(() => {
                localStorage.setItem('mts_questions', JSON.stringify(questions));
            }, [questions]);

            React.useEffect(() => {
                localStorage.setItem('mts_attempts', JSON.stringify(studentAttempts));
            }, [studentAttempts]);

            // Timer countdown effect
            React.useEffect(() => {
                let timer = null;
                if (timerActive && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                handleAutoSubmit();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [timerActive, timeLeft]);

            const calculateScore = (userAnswers) => {
                let totalPoints = 0;
                let maxPoints = 0;

                questions.forEach(q => {
                    if (q.type === 'pg') {
                        maxPoints += 4; // 15 * 4 = 60
                        if (userAnswers[q.id] === q.correctAnswer) {
                            totalPoints += 4;
                        }
                    } else if (q.type === 'pgk') {
                        maxPoints += 10; // 2 * 10 = 20
                        const userSel = userAnswers[q.id] || [];
                        const correctSel = q.correctAnswers || [];
                        // Check exact match
                        const isExact = userSel.length === correctSel.length && 
                                        userSel.every(val => correctSel.includes(val));
                        if (isExact) {
                            totalPoints += 10;
                        } else {
                            // Partial score logic
                            let matchCount = 0;
                            userSel.forEach(val => {
                                if (correctSel.includes(val)) matchCount++;
                            });
                            const wrongCount = userSel.filter(val => !correctSel.includes(val)).length;
                            let partial = (matchCount * 2.5) - (wrongCount * 2);
                            if (partial > 0) totalPoints += Math.min(partial, 8);
                        }
                    } else if (q.type === 'match') {
                        maxPoints += 8; // 2 * 8 = 16
                        const userMatch = userAnswers[q.id] || {};
                        q.pairs.forEach(pair => {
                            if (userMatch[pair.item] === pair.correctTarget) {
                                totalPoints += 2; // 4 pairs * 2 = 8
                            }
                        });
                    } else if (q.type === 'short') {
                        maxPoints += 4; // 1 * 4 = 4
                        const val = (userAnswers[q.id] || '').trim().toLowerCase();
                        if (q.acceptableAnswers.some(ans => val.includes(ans.toLowerCase()))) {
                            totalPoints += 4;
                        }
                    }
                });

                // Total max = 100

                return Math.min(finalScore, 100);

                                    <span className="text-xs text-slate-500 mt-1">KKM: 80</span>
                                </div>
                            </div>

                            {/* Identity Details */}
                            <div className="bg-slate-50 rounded-xl p-6 mb-8 border border-slate-200 grid sm:grid-cols-2 gap-4 text-sm">
                                <div>
                                    <span className="text-xs text-slate-400 uppercase font-bold block">Nama Lengkap Siswa</span>
                                    <span className="font-bold text-slate-800">{finalResult.nama}</span>
                                </div>
                                <div>
                                    <span className="text-xs text-slate-400 uppercase font-bold block">Kelas / Presensi</span>
                                    <span className="font-bold text-slate-800">{finalResult.kelas} / No. {finalResult.presensi}</span>
                                </div>
                                <div>
                                    <span className="text-xs text-slate-400 uppercase font-bold block">Waktu Pengerjaan</span>
                                    <span className="font-bold text-slate-800">{finalResult.timeSpent || '30 menit'}</span>
                                </div>
                                <div>
                                    <span className="text-xs text-slate-400 uppercase font-bold block">Tanggal Selesai</span>
                                    <span className="font-bold text-slate-800">{finalResult.date}</span>
                                </div>
                            </div>

                            {/* Action Buttons */}
                            <div className="flex flex-wrap items-center justify-center gap-4 no-print border-t border-slate-100 pt-6">
                                <button 
                                    onClick={() => window.print()} 
                                    className="px-6 py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-lg flex items-center gap-2"
                                >
                                    <i className="fa-solid fa-print"></i> Cetak / Download Kartu Hasil (PDF)
                                </button>
                                <button 
                                    onClick={() => setView('login')} 
                                    className="px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl flex items-center gap-2"
                                >
                                    <i className="fa-solid fa-house"></i> Kembali ke Halaman Utama
                                </button>
                            </div>

                            {/* Pembahasan & Review Soal */}
                            <div className="mt-10 pt-8 border-t border-slate-200">
                                <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                    <i className="fa-solid fa-book-open text-teal-600"></i> Review Jawaban & Pembahasan
                                </h3>

                                <div className="space-y-6">
                                    {questions.map((q, idx) => {
                                        return (
                                            <div key={idx} className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-sm">
                                                <div className="font-bold text-slate-800 mb-2">
                                                    {idx + 1}. {q.question}
                                                </div>
                                                <div className="text-xs text-slate-600 bg-white p-3 rounded-lg border border-slate-200 mb-2">
                                                    <strong>Kunci / Pembahasan:</strong> {q.explanation}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderAdminView = () => {
                const [adminTab, setAdminTab] = React.useState('results'); // 'results', 'edit_soal', 'settings'
                const [editingQ, setEditingQ] = React.useState(null);

                return (
                    <div className="max-w-6xl mx-auto px-4 py-8">
                        {/* Admin Navigation Header */}
                        <div className="bg-slate-800 text-white rounded-2xl shadow-xl p-6 mb-8 flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <h1 className="text-xl font-bold flex items-center gap-2">
                                    <i className="fa-solid fa-user-gear text-teal-400"></i> Panel Kontrol Guru / Admin
                                </h1>
                                <p className="text-xs text-slate-400 mt-1">MGMP IPA MTs Kota Malang - Wiwik Astutik, S. Pd</p>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <button 
                                    onClick={() => {
                                        startExam({ nama: 'Simulasi Guru (Admin)', kelas: 'VIII A', presensi: '99' }, true);
                                    }}
                                    className="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5"
                                >
                                    <i className="fa-solid fa-vial"></i> Uji Coba Soal (Sebagai Siswa)
                                </button>
                                <button 
                                    onClick={() => setView('login')}
                                    className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl shadow flex items-center gap-1.5"
                                >
                                    <i className="fa-solid fa-right-from-bracket"></i> Keluar
                                </button>
                            </div>
                        </div>

                        {/* Admin Sub Tabs */}
                        <div className="flex border-b border-slate-200 mb-6 gap-2">
                            <button 
                                onClick={() => setAdminTab('results')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 ${adminTab === 'results' ? 'bg-white border-t-2 border-teal-600 text-teal-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                <i className="fa-solid fa-list-check"></i> Rekap Hasil Siswa ({studentAttempts.length})
                            </button>
                            <button 
                                onClick={() => setAdminTab('edit_soal')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 ${adminTab === 'edit_soal' ? 'bg-white border-t-2 border-teal-600 text-teal-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                <i className="fa-solid fa-pen-to-square"></i> Kelola & Edit Soal ({questions.length})
                            </button>
                            <button 
                                onClick={() => setAdminTab('settings')}
                                className={`px-5 py-3 font-bold text-sm rounded-t-xl transition flex items-center gap-2 ${adminTab === 'settings' ? 'bg-white border-t-2 border-teal-600 text-teal-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}
                            >
                                <i className="fa-solid fa-sliders"></i> Pengaturan Logo & Password
                            </button>
                        </div>

                        {/* TAB 1: Student Results Table */}
                        {adminTab === 'results' && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold text-slate-800 text-base">Data Pengerjaan Siswa</h3>
                                    <button 
                                        onClick={() => {
                                            Swal.fire({
                                                title: 'Hapus Semua Data Hasil?',
                                                text: 'Seluruh rekap nilai siswa akan dihapus permanen!',
                                                icon: 'warning',
                                                showCancelButton: true,
                                                confirmButtonColor: '#e11d48',
                                                confirmButtonText: 'Ya, Hapus Semua'
                                            }).then(res => {
                                                if (res.isConfirmed) setStudentAttempts([]);
                                            });
                                        }}
                                        className="px-3 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 font-semibold text-xs rounded-lg border border-rose-200"
                                    >
                                        <i className="fa-solid fa-trash mr-1"></i> Bersihkan Rekap
                                    </button>
                                </div>

                                {studentAttempts.length === 0 ? (
                                    <div className="text-center py-12 text-slate-400">
                                        <i className="fa-regular fa-folder-open text-4xl mb-2 block"></i>
                                        <p className="text-sm">Belum ada siswa yang menyelesaikan ujian.</p>
                                    </div>
                                ) : (
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm text-slate-700">
                                            <thead className="bg-slate-100 text-slate-600 uppercase text-[11px] font-bold">
                                                <tr>
                                                    <th className="p-3 rounded-l-lg">No</th>
                                                    <th className="p-3">Nama Siswa</th>
                                                    <th className="p-3">Kelas</th>
                                                    <th className="p-3">No. Presensi</th>
                                                    <th className="p-3">Skor</th>
                                                    <th className="p-3">Status KKM (80)</th>
                                                    <th className="p-3 rounded-r-lg">Waktu Selesai</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {studentAttempts.map((item, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50">
                                                        <td className="p-3 font-semibold">{idx + 1}</td>
                                                        <td className="p-3 font-bold text-slate-800">{item.nama}</td>
                                                        <td className="p-3">{item.kelas}</td>
                                                        <td className="p-3">{item.presensi}</td>
                                                        <td className="p-3 font-extrabold text-base">{item.score}</td>
                                                        <td className="p-3">
                                                            <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${item.passed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                                {item.passed ? 'LULUS' : 'REMEDIAL'}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-xs text-slate-500">{item.date}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 2: Edit Questions */}
                        {adminTab === 'edit_soal' && (
                            <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                                <h3 className="font-bold text-slate-800 text-base mb-4">Daftar Soal Asesmen (20 Soal)</h3>

                                <div className="space-y-4">
                                    {questions.map((q, idx) => (
                                        <div key={q.id} className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <div>
                                                <span className="text-xs font-bold text-teal-700 bg-teal-100 px-2 py-0.5 rounded mr-2">
                                                    Soal {idx + 1} ({q.type.toUpperCase()})
                                                </span>
                                                <p className="text-sm text-slate-800 font-medium mt-1 line-clamp-2">{q.question}</p>
                                            </div>
                                            <button 
                                                onClick={() => setEditingQ(q)}
                                                className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-lg shrink-0 flex items-center gap-1"
                                            >
                                                <i className="fa-solid fa-pen"></i> Edit Soal Ini
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Edit Question Modal */}
                        {editingQ && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6">
                                    <h3 className="font-bold text-slate-800 text-lg mb-4">Edit Soal No. {editingQ.id}</h3>
                                    
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const updatedText = e.target.questionText.value;
                                        const updatedExp = e.target.explanationText.value;

                                        const nextQuestions = questions.map(q => {
                                            if (q.id === editingQ.id) {
                                                return {
                                                    ...q,
                                                    question: updatedText,
                                                    explanation: updatedExp
                                                };
                                            }
                                            return q;
                                        });

                                        setQuestions(nextQuestions);
                                        setEditingQ(null);
                                        Swal.fire('Berhasil', 'Soal telah diperbarui!', 'success');
                                    }}>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Teks Pertanyaan Soal</label>
                                            <textarea 
                                                name="questionText"
                                                rows="4"
                                                defaultValue={editingQ.question}
                                                className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500"
                                                required
                                            ></textarea>
                                        </div>

                                        <div className="mb-6">
                                            <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Kunci & Pembahasan Soal</label>
                                            <textarea 
                                                name="explanationText"
                                                rows="3"
                                                defaultValue={editingQ.explanation}
                                                className="w-full p-3 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500"
                                                required
                                            ></textarea>
                                        </div>

                                        <div className="flex justify-end gap-3">
                                            <button 
                                                type="button"
                                                onClick={() => setEditingQ(null)}
                                                className="px-4 py-2 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                                            >
                                                Batal
                                            </button>
                                            <button 
                                                type="submit"
                                                className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs rounded-xl shadow"
                                            >
                                                Simpan Perubahan
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* TAB 3: System Settings */}
                        {adminTab === 'settings' && (
                            <div className="grid md:grid-cols-2 gap-6">
                                {/* Password Change Form */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                                    <h3 className="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-lock text-teal-600"></i> Ganti Password Admin
                                    </h3>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const newP = e.target.newPass.value;
                                        if (newP.length < 4) {
                                            Swal.fire('Error', 'Password minimal 4 karakter!', 'error');
                                            return;
                                        }
                                        setAdminPass(newP);
                                        localStorage.setItem('mts_admin_pass', newP);
                                        Swal.fire('Berhasil', 'Password admin berhasil diubah!', 'success');
                                        e.target.reset();
                                    }}>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Password Baru</label>
                                            <input 
                                                type="password" 
                                                name="newPass"
                                                required
                                                className="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm"
                                            />
                                        </div>
                                        <button 
                                            type="submit"
                                            className="px-4 py-2 bg-teal-600 text-white font-bold text-xs rounded-xl shadow"
                                        >
                                            Update Password
                                        </button>
                                    </form>
                                </div>

                                {/* Logo & Header Settings */}
                                <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                                    <h3 className="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-image text-teal-600"></i> Edit Logo & Judul Header
                                    </h3>
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const newLogo = e.target.logo.value.trim();
                                        const newTitle = e.target.title.value.trim();
                                        const newPenyusun = e.target.penyusunInput.value.trim();

                                        setLogoUrl(newLogo);
                                        setHeaderTitle(newTitle);
                                        setPenyusun(newPenyusun);

                                        localStorage.setItem('mts_logo_url', newLogo);
                                        localStorage.setItem('mts_header_title', newTitle);
                                        localStorage.setItem('mts_penyusun', newPenyusun);

                                        Swal.fire('Berhasil', 'Pengaturan header & logo disimpan!', 'success');
                                    }}>
                                        <div className="mb-3">
                                            <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">URL Logo</label>
                                            <input 
                                                type="text" 
                                                name="logo"
                                                defaultValue={logoUrl}
                                                className="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm"
                                            />
                                        </div>
                                        <div className="mb-3">
                                            <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Judul Asesmen</label>
                                            <input 
                                                type="text" 
                                                name="title"
                                                defaultValue={headerTitle}
                                                className="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm"
                                            />
                                        </div>
                                        <div className="mb-4">
                                            <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Nama Penyusun</label>
                                            <input 
                                                type="text" 
                                                name="penyusunInput"
                                                defaultValue={penyusun}
                                                className="w-full px-4 py-2 rounded-xl border border-slate-300 text-sm"
                                            />
                                        </div>
                                        <button 
                                            type="submit"
                                            className="px-4 py-2 bg-teal-600 text-white font-bold text-xs rounded-xl shadow"
                                        >
                                            Simpan Pengaturan
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    {view === 'login' && renderLoginView()}
                    {view === 'exam' && renderExamView()}
                    {view === 'result' && renderResultView()}
                    {view === 'admin' && renderAdminView()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
